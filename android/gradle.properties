org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Reuse verified task outputs when the pinned CI Gradle action restores its local cache.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle process, not a separate Kotlin daemon JVM. CI job containers are capped at
# 5 GiB; on 2026-11-07 the v0.12.1 release candidate (Gradle daemon, Kotlin daemon and test/lint workers in one
# container) hit the cap and the Gradle daemon was OOM-killed.
kotlin.compiler.execution.strategy=in-process
