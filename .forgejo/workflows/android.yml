# Forgejo is primary; GitHub is a push mirror with Actions off. Ported from the
# GitHub workflow on 2026-11-03 with the same jobs and gates, and these changes:
#   - Forgejo skips a job-level `if` on a job with `needs` even when it is true,
#     so each such job's condition is its first step ("gate") and every later
#     step requires RUN_JOB=1.
#   - The runner gives every job container /dev/kvm (its own config; the runner
#     VM has nested KVM); the emulator jobs' udev step only checks the device.
#   - Artifacts use Forgejo's upload/download-artifact; other actions are
#     fetched from GitHub by full URL, pinned to the same commits.
#   - Signing secrets and the GitHub release token come from OpenBao (role
#     publish-runway: a v* tag pushed by andrew in this repository only), not
#     from Forgejo or GitHub secrets; the pinned certificate is written here.
#   - The release is published to the GitHub mirror once the mirror has the tag.
name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: runway-android-${{ github.ref }}
  cancel-in-progress: true

enable-openid-connect: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether Android verification is required
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          android=true
          if [ "$GITHUB_REF_TYPE" != tag ] &&
            [ -n "${BASE_SHA:-}" ] &&
            [[ ! "$BASE_SHA" =~ ^0+$ ]] &&
            git cat-file -e "${BASE_SHA}^{commit}"
          then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
            if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .forgejo/workflows/android.yml \
              android/app android/data android/domain android/ci android/fdroid android/gradle \
              android/gradlew android/gradlew.bat android/build.gradle.kts \
              android/settings.gradle.kts android/gradle.properties android/lint.xml
            then
              android=false
            fi
          else
            git show --check --format= "$GITHUB_SHA"
          fi
          echo "Android verification required: $android"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  # Unit tests, lint, and the complexity ceiling share one job: one JDK/SDK/Gradle setup and one
  # compile instead of two, and each PR holds two of the runner's three slots instead of three,
  # so another PR's instrumentation is not left queueing behind it.
  unit-lint:
    name: unit and lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ github.ref_type != 'tag' && needs.changes.outputs.android == 'true' }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          persist-credentials: false
      - name: Verify bounded instrumentation discovery
        if: env.RUN_JOB == '1'
        run: |
          python3 android/ci/test_discover_instrumentation_tests.py
          python3 android/ci/discover-instrumentation-tests.py app >/dev/null
          python3 android/ci/discover-instrumentation-tests.py data >/dev/null
      - name: Enforce McCabe complexity ceiling
        if: env.RUN_JOB == '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/runway-complexity"
          "$RUNNER_TEMP/runway-complexity/bin/pip" install --require-hashes -r android/ci/requirements-complexity.txt
          RUNWAY_COMPLEXITY_PYTHON="$RUNNER_TEMP/runway-complexity/bin/python" \
            bash android/ci/check-complexity.sh
      - uses: https://github.com/gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: env.RUN_JOB == '1'
      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.RUN_JOB == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: https://github.com/gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: env.RUN_JOB == '1'
      - uses: https://github.com/android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_JOB == '1'
        with:
          packages: platforms;android-36 build-tools;35.0.0
      - name: Run pure and unit tests, then lint
        if: env.RUN_JOB == '1'
        run: >-
          android/gradlew -p android --no-daemon --max-workers=2 --stacktrace
          --dependency-verification strict --continue
          :domain:test :data:testDebugUnitTest :app:testDebugUnitTest lint

  package:
    name: package and androidTest compile
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ needs.changes.outputs.android == 'true' }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          persist-credentials: false
      - uses: https://github.com/gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: env.RUN_JOB == '1'
      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.RUN_JOB == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: https://github.com/gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: env.RUN_JOB == '1'
      - uses: https://github.com/android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_JOB == '1'
        with:
          packages: platforms;android-36 build-tools;35.0.0
      - name: Package debug APK and compile instrumentation tests
        if: env.RUN_JOB == '1'
        run: >-
          android/gradlew -p android --no-daemon --max-workers=2 --stacktrace
          --dependency-verification strict
          :app:assembleDebug :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest
      - name: Upload instrumentation APKs
        if: env.RUN_JOB == '1'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: instrumentation-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/data/build/outputs/apk/androidTest/debug/data-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1

  instrumentation:
    name: instrumentation
    needs: [changes, package]
    # Emulator job: see the note on release-device-smoke about running one emulator at a time.
    runs-on: android-emulator
    timeout-minutes: 90
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ needs.changes.outputs.android == 'true' && needs.package.result == 'success' }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          persist-credentials: false
      - name: Verify bounded instrumentation discovery
        if: env.RUN_JOB == '1'
        run: |
          python3 android/ci/test_discover_instrumentation_tests.py
          python3 android/ci/discover-instrumentation-tests.py app >/dev/null
          python3 android/ci/discover-instrumentation-tests.py data >/dev/null
      - name: Check KVM is available
        if: env.RUN_JOB == '1'
        run: |
          id; ls -l /dev/kvm || echo "no /dev/kvm in this container"
          test -r /dev/kvm && test -w /dev/kvm
      # GitHub's runners ship the X11/GL/audio libraries the emulator loads even headless; the act image doesn't.
      - name: Install emulator runtime libraries
        if: env.RUN_JOB == '1'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxi6 libxtst6 libxcomposite1 libxcursor1 \
            libxdamage1 libxfixes3 libxrandr2 libxkbfile1 libxkbcommon0 libgl1 libegl1 libgbm1 libdrm2 \
            libnss3 libpulse0 libasound2t64 libfontconfig1 libfreetype6 libdbus-1-3 >/dev/null
      # GitHub's runners have Java preinstalled; the act image doesn't, and sdkmanager needs it.
      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.RUN_JOB == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: https://github.com/android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_JOB == '1'
        with:
          # android-emulator-runner installs the platform, emulator build, and system image it needs;
          # installing them here as well downloaded the emulator twice.
          packages: platform-tools
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        if: env.RUN_JOB == '1'
        with:
          name: instrumentation-apks
          path: android
      - name: Verify downloaded instrumentation APKs
        if: env.RUN_JOB == '1'
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s android/data/build/outputs/apk/androidTest/debug/data-debug-androidTest.apk
      - name: Run instrumentation tests on a serial emulator
        if: env.RUN_JOB == '1'
        uses: https://github.com/ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          # Stable emulator 37.2.13 hangs at boot under nested AMD KVM on the Forgejo runner (vCPU threads stop
          # responding before the guest kernel prints); 37.3.6 boots in about 70 s. Tested on the runner 2026-11-04.
          # Move to a stable build once one past 37.3.6 is out.
          emulator-build: 16696583  # emulator 37.3.6
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          emulator-port: 5554
          emulator-boot-timeout: 600
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none
          script: bash android/ci/run-instrumentation.sh
      - name: Upload native documentation screenshots
        if: env.RUN_JOB == '1' && (success())
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: native-ui-screenshots
          path: ${{ runner.temp }}/runway-native-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload instrumentation diagnostics
        if: env.RUN_JOB == '1' && (failure())
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            ${{ runner.temp }}/adb-devices.txt
            ${{ runner.temp }}/emulator-app-meminfo.txt
            ${{ runner.temp }}/emulator-events.txt
            ${{ runner.temp }}/emulator-last-anr.txt
            ${{ runner.temp }}/emulator-logcat.txt
            ${{ runner.temp }}/emulator-packages.txt
            ${{ runner.temp }}/package-compile-*.txt
            ${{ runner.temp }}/app-instrumentation.txt
            ${{ runner.temp }}/data-instrumentation.txt
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  release-build:
    name: unsigned release candidate
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: env.RUN_JOB == '1'
      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.RUN_JOB == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: https://github.com/gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: env.RUN_JOB == '1'
      - uses: https://github.com/android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_JOB == '1'
        with:
          packages: platforms;android-36 build-tools;35.0.0
      - name: Gate tag version and ancestry
        if: env.RUN_JOB == '1'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$tag" =~ ^v${semver}$ ]]; then
            echo "::error::Release tags must use v<semver>."
            exit 1
          fi
          if [[ ! "$version" =~ ^${semver}$ ]] || [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag must exactly match Android versionName $version."
            exit 1
          fi
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' android/app/build.gradle.kts)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Could not read a positive Android versionCode."
            exit 1
          }
          tagged_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$tagged_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::Version tags must point to a commit in ${DEFAULT_BRANCH} history."
            exit 1
          fi
          previous_tag=''
          while IFS= read -r candidate; do
            if [ "$candidate" != "$tag" ]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged "$tagged_commit" --list 'v*' --sort=-version:refname)
          if [ -n "$previous_tag" ]; then
            previous_code="$(git show "${previous_tag}:android/app/build.gradle.kts" |
              sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p')"
            [[ "$previous_code" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Could not read Android versionCode from ${previous_tag}."
              exit 1
            }
            if [ "$version_code" -le "$previous_code" ]; then
              echo "::error::Android versionCode ${version_code} must exceed ${previous_code} from ${previous_tag}."
              exit 1
            fi
          fi
      - name: Build and test the unsigned release candidate once
        if: env.RUN_JOB == '1'
        run: >-
          android/gradlew -p android --no-daemon --max-workers=2 --stacktrace
          --dependency-verification strict -PrunwayFdroidSourceBuild=true
          lint test assembleRelease
      - name: Upload unsigned release candidate
        if: env.RUN_JOB == '1'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: unsigned-android-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          # Protected-environment approval can legitimately wait overnight.
          retention-days: 7

  release-device-smoke:
    name: release candidate device smoke
    needs: release-build
    runs-on: android-emulator
    # Run one emulator at a time: two 4 GiB emulators plus Gradle jobs exhausted the 16 GiB runner
    # on 2026-11-04, and three froze it on 2026-11-05. Forgejo 17.0.1 ignores job-level `concurrency`,
    # so emulator jobs use the `android-emulator` label, served by a dedicated capacity-1 runner daemon
    # (same image as ubuntu-latest, 6 GiB memory cap per job); see docs/ANDROID.md.
    timeout-minutes: 30
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.RUN_JOB == '1'
        with:
          distribution: temurin
          java-version: '17'
      - name: Check KVM is available
        if: env.RUN_JOB == '1'
        run: |
          id; ls -l /dev/kvm || echo "no /dev/kvm in this container"
          test -r /dev/kvm && test -w /dev/kvm
      # GitHub's runners ship the X11/GL/audio libraries the emulator loads even headless; the act image doesn't.
      - name: Install emulator runtime libraries
        if: env.RUN_JOB == '1'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxi6 libxtst6 libxcomposite1 libxcursor1 \
            libxdamage1 libxfixes3 libxrandr2 libxkbfile1 libxkbcommon0 libgl1 libegl1 libgbm1 libdrm2 \
            libnss3 libpulse0 libasound2t64 libfontconfig1 libfreetype6 libdbus-1-3 >/dev/null
      - uses: https://github.com/android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_JOB == '1'
        with:
          # android-emulator-runner installs the platform, emulator build, and system image it needs;
          # installing them here as well downloaded the emulator twice.
          packages: platform-tools
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        if: env.RUN_JOB == '1'
        with:
          name: unsigned-android-release
          path: unsigned
      - name: Install and launch an ephemeral-signed copy
        if: env.RUN_JOB == '1'
        uses: https://github.com/ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          # Stable emulator 37.2.13 hangs at boot under nested AMD KVM on the Forgejo runner (vCPU threads stop
          # responding before the guest kernel prints); 37.3.6 boots in about 70 s. Tested on the runner 2026-11-04.
          # Move to a stable build once one past 37.3.6 is out.
          emulator-build: 16696583  # emulator 37.3.6
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          emulator-port: 5554
          emulator-boot-timeout: 600
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none
          script: bash android/ci/run-release-device-smoke.sh unsigned/app-release-unsigned.apk
      - name: Upload release-smoke diagnostics
        if: env.RUN_JOB == '1' && (failure())
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android-release-smoke-diagnostics
          path: ${{ runner.temp }}/release-smoke-*.txt
          if-no-files-found: warn
          retention-days: 14

  android-release:
    name: protected signing
    needs: [release-build, instrumentation, release-device-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          persist-credentials: false
      # GitHub's runners have Java preinstalled; the act image doesn't, and sdkmanager needs it.
      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.RUN_JOB == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: https://github.com/android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_JOB == '1'
        with:
          packages: build-tools;36.0.0
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        if: env.RUN_JOB == '1'
        with:
          name: unsigned-android-release
          path: unsigned
      - name: Signing key from OpenBao (role publish-runway)
        if: env.RUN_JOB == '1'
        env:
          BAO_ADDR: https://bao.bargen.ca
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://bao.bargen.ca" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          token=$(python3 -c 'import json,sys; print(json.dumps({"role": "publish-runway", "jwt": sys.argv[1]}))' "$jwt" \
                  | curl -sS -X POST --data @- "${BAO_ADDR}/v1/auth/forgejo/login" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["auth"]["client_token"]) if d.get("auth") else sys.exit("OpenBao refused the login: " + "; ".join(d.get("errors", [])))')
          echo "::add-mask::${token}"
          get() { curl -fsS -H "X-Vault-Token: ${token}" "${BAO_ADDR}/v1/secret/data/$1" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["data"][sys.argv[1]])' "$2"; }
          for pair in RUNWAY_ANDROID_KEYSTORE_BASE64=runway/android-signing:keystore_base64 RUNWAY_ANDROID_KEYSTORE_PASSWORD=runway/android-signing:keystore_password RUNWAY_ANDROID_KEY_ALIAS=runway/android-signing:key_alias RUNWAY_ANDROID_KEY_PASSWORD=runway/android-signing:key_password; do
            name=${pair%%=*}; ref=${pair#*=}
            value=$(get "${ref%%:*}" "${ref#*:}")
            echo "::add-mask::${value}"
            { echo "${name}<<RUNWAY_EOF"; printf '%s\n' "$value"; echo RUNWAY_EOF; } >> "$GITHUB_ENV"
          done
      - name: Sign the protected candidate
        if: env.RUN_JOB == '1'
        shell: bash
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/runway-release.p12"
          trap 'rm -f "$keystore"' EXIT
          for name in RUNWAY_ANDROID_KEYSTORE_BASE64 RUNWAY_ANDROID_KEYSTORE_PASSWORD RUNWAY_ANDROID_KEY_ALIAS RUNWAY_ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::OpenBao did not provide ${name}."; exit 1; }
          done
          printf '%s' "$RUNWAY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          mkdir -p release-assets
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias "$RUNWAY_ANDROID_KEY_ALIAS" --ks-pass env:RUNWAY_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:RUNWAY_ANDROID_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --out "release-assets/runway-${GITHUB_REF_NAME}.apk" unsigned/app-release-unsigned.apk
      - name: Verify APK identity and exact signing certificate
        if: env.RUN_JOB == '1'
        shell: bash
        env:
          RUNWAY_ANDROID_CERT_SHA256: "07:40:A9:86:92:5C:D4:2C:1C:E6:ED:46:0B:AB:D4:F2:38:C9:A0:03:9B:84:2B:0F:82:CC:FB:F2:EB:A2:8A:DC"
        run: |
          set -euo pipefail
          apk="release-assets/runway-${GITHUB_REF_NAME}.apk"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
          printf '%s\n' "$badging"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_name="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          expected_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' android/app/build.gradle.kts)"
          [ "$package_name" = 'dev.deftmartian.runway' ] || { echo '::error::APK package id is not dev.deftmartian.runway.'; exit 1; }
          [ "$version_name" = "${GITHUB_REF_NAME#v}" ] || { echo '::error::APK versionName does not match the release tag.'; exit 1; }
          [[ "$expected_code" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Could not read a positive Android versionCode.'; exit 1; }
          [ "$version_code" = "$expected_code" ] || { echo '::error::APK versionCode does not match the source release version.'; exit 1; }
          permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' <<< "$permissions"; then
            echo '::error::Standalone APK unexpectedly requests a network permission.'
            exit 1
          fi
          verification="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' <<< "$verification"
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true$' <<< "$verification"
          grep -q '^Number of signers: 1$' <<< "$verification"
          expected="$(tr '[:upper:]' '[:lower:]' <<< "${RUNWAY_ANDROID_CERT_SHA256//:/}" | tr -d '[:space:]')"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$verification" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::RUNWAY_ANDROID_CERT_SHA256 must be a SHA-256 fingerprint.'; exit 1; }
          [ "$actual" = "$expected" ] || { echo '::error::The APK signer does not match the pinned Android release certificate.'; exit 1; }
          (cd release-assets && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          printf 'SHA-256: %s\n' "$actual" > "${apk}.signer.txt"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: env.RUN_JOB == '1'
        with:
          name: signed-android-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: publish GitHub release
    needs: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate (Forgejo skips a job-level if on jobs with needs)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: echo "RUN_JOB=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN_JOB == '1'
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        if: env.RUN_JOB == '1'
        with:
          name: signed-android-release
          path: release-assets
      - name: GitHub release token from OpenBao (role publish-runway)
        if: env.RUN_JOB == '1'
        env:
          BAO_ADDR: https://bao.bargen.ca
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://bao.bargen.ca" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          token=$(python3 -c 'import json,sys; print(json.dumps({"role": "publish-runway", "jwt": sys.argv[1]}))' "$jwt" \
                  | curl -sS -X POST --data @- "${BAO_ADDR}/v1/auth/forgejo/login" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["auth"]["client_token"]) if d.get("auth") else sys.exit("OpenBao refused the login: " + "; ".join(d.get("errors", [])))')
          echo "::add-mask::${token}"
          get() { curl -fsS -H "X-Vault-Token: ${token}" "${BAO_ADDR}/v1/secret/data/$1" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["data"][sys.argv[1]])' "$2"; }
          for pair in GH_TOKEN=github/runway-release-token:token; do
            name=${pair%%=*}; ref=${pair#*=}
            value=$(get "${ref%%:*}" "${ref#*:}")
            echo "::add-mask::${value}"
            { echo "${name}<<RUNWAY_EOF"; printf '%s\n' "$value"; echo RUNWAY_EOF; } >> "$GITHUB_ENV"
          done
      - name: Wait for the GitHub mirror to carry the tag
        if: env.RUN_JOB == '1'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/deftmartian/runway/git/ref/tags/${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          echo "::error::The GitHub mirror never received ${GITHUB_REF_NAME}."; exit 1
      - name: Publish signed APK assets
        if: env.RUN_JOB == '1'
        env:
          GH_REPO: deftmartian/runway
        run: |
          set -euo pipefail
          notes_file="android/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            if [ -s "$notes_file" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
            fi
          elif [ -s "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
