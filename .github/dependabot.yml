version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: sunday
      time: '06:15'
      timezone: Etc/UTC
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: sunday
      time: '06:30'
      timezone: Etc/UTC
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: sunday
      time: '06:45'
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: gradle
    directory: /android
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: sunday
      time: '07:00'
      timezone: Etc/UTC
    groups:
      android-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
      - dependency-name: gradle-wrapper
        # Keep 8.13.x patches flowing, but move later Gradle lines with the
        # reviewed AGP, built-in Kotlin, and SDK 37 migration.
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: androidx.core:core-ktx
        # Core 1.19+ requires compileSdk 37. Keep 1.18.x patches flowing until the
        # AGP 9, Gradle 9, and SDK 37 migration is handled as one reviewed change.
        update-types: [version-update:semver-minor, version-update:semver-major]
